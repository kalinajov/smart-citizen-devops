# Credentials, kept separate from the ConfigMap so they can be rotated,
# access-controlled and encrypted at rest independently of ordinary settings.
#
# NOTE: these are throwaway demo values, committed on purpose so the stack can
# be brought up from a clean checkout. A real deployment would never commit this
# file — it would create the Secret out-of-band, e.g.
#
#   kubectl create secret generic app-secrets -n smart-citizen \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" ...
#
# stringData takes plain text and Kubernetes base64-encodes it on write, which
# keeps the file readable. (base64 is encoding, not encryption — it hides
# nothing. The protection comes from RBAC and encryption at rest.)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: smart-citizen
  labels:
    app.kubernetes.io/part-of: smart-citizen
type: Opaque
stringData:
  # Consumed by the Postgres StatefulSet.
  POSTGRES_PASSWORD: devpassword

  # Consumed by the API. Host 'postgres' is the headless Service; '.smart-citizen'
  # is implicit for pods in the same namespace. The +psycopg suffix selects the
  # psycopg3 driver, which is what requirements.txt installs.
  DATABASE_URL: postgresql+psycopg://postgres:devpassword@postgres:5432/smart_citizen

  # Unused while SUPABASE_MOCK_VERIFY is true. Replace with real values and flip
  # DEV_SKIP_AUTH/SUPABASE_MOCK_VERIFY to false to exercise real authentication.
  SUPABASE_URL: "https://placeholder.supabase.co"
  SUPABASE_ANON_KEY: "placeholder-anon-key"
